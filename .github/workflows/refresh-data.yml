name: Refresh site data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate data and run tests
        run: npm run check

      - name: Refresh data from GitHub and npm APIs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          node scripts/refresh-data.mjs > "$RUNNER_TEMP/refresh.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/refresh.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          node scripts/validate-data.mjs
          {
            echo '## Data refresh'
            echo '```'
            cat "$RUNNER_TEMP/refresh.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          if git diff --quiet data/site-data.json sitemap.xml llms.txt; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/site-data.json sitemap.xml llms.txt
            git commit -m "chore(site): refresh data from GitHub API"
            git pull --rebase --autostash
            git push
          fi
