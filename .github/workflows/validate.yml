name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Check syntax
        run: |
          for file in assets/js/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done

      - name: Validate data
        run: node scripts/validate-data.mjs

      - name: Run tests
        run: node --test "tests/*.test.mjs"
