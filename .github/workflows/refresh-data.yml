name: Refresh site data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/avatar.js
          node --check scripts/refresh-data.mjs
          node --check scripts/validate-data.mjs
      - name: Refresh data from GitHub and npm APIs
        run: |
          node scripts/refresh-data.mjs
          node scripts/validate-data.mjs

      - name: Commit changes
        run: |
          if git diff --quiet data/site-data.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/site-data.json
            git commit -m "chore(site): refresh data from GitHub API"
            git pull --rebase
            git push
          fi
